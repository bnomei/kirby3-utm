title: UTM
icon: utm-bars

options:
  changeSlug: false
  changeStatus: false
  changeTemplate: false
  changeTitle: false
  delete: false
  duplicate: false
  update: false

columns:
  stats:
    width: 1/1
    fields:
      stats:
        type: stats
        reports: page.reports('stats')
  pages:
    width: 1/1
    fields:
      campaigns:
        type: pagelist
        create: false
        image: false
        search: true # only titles
        sortable: false
        layout: table
        sortBy: visited_at desc
        columns:
          events_count: true
          unique_visitors: true
          visited_at: true
        # TODO: columns
        blueprints:
          - utm-campaign
